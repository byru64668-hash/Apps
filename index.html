<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1f4e79"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"><title>SchoolTrack</title></head><body><header><div class="brand"><span>📦</span><div><h1>SchoolTrack</h1><p>Offline School Inventory System</p></div></div></header><main><section><h2>📊 Dashboard</h2><div class="cards"><article>Total Stock<b id="total">0</b></article><article>Available<b id="available">0</b></article><article>Borrowed<b id="borrowed">0</b></article><article>Repair<b id="repair">0</b></article><article>Missing<b id="missing">0</b></article><article>Pending Reports<b id="pending">0</b></article></div></section><section><h2>📦 Inventory</h2><button onclick="addItem()">+ Add New Item</button><input id="search" placeholder="🔎 Search inventory" oninput="render()"><div id="items"></div></section><section><h2>📝 Reports</h2><button onclick="addReport()">+ Add Report</button><div id="reports"></div></section><section><h2>💾 Backup</h2><button onclick="backup()">Export Backup</button><button onclick="restore()">Import Backup</button><input id="file" type="file" accept=".json" hidden></section></main><script src="app.js"></script></body></html>
